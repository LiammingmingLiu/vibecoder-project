<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>游戏搭子 · 一句话找到今晚的队友</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        ink:  '#08080d',
        ink2: '#0e0e17',
        neon: '#b8f34a',
        cyan2:'#4fe3d0',
        haze: '#8a8aa3'
      },
      fontFamily: {
        sans: ['-apple-system','BlinkMacSystemFont','PingFang SC','Hiragino Sans GB','Microsoft YaHei','sans-serif']
      }
    }
  }
}
</script>
<style>
  html,body{background:#08080d;-webkit-tap-highlight-color:transparent;}
  body{overscroll-behavior:none;}
  .glow-bg::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(60vw 60vw at 12% 8%, rgba(184,243,74,.10), transparent 60%),
      radial-gradient(55vw 55vw at 88% 92%, rgba(79,227,208,.10), transparent 60%),
      radial-gradient(40vw 40vw at 70% 20%, rgba(140,90,255,.08), transparent 60%);
  }
  .card{background:rgba(255,255,255,.045);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);}
  .chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);}
  .chip-on{background:rgba(184,243,74,.14);border-color:rgba(184,243,74,.5);color:#d6ff8f;}
  textarea{resize:none;}
  .focus-glow:focus-within{border-color:rgba(184,243,74,.55);box-shadow:0 0 0 4px rgba(184,243,74,.10),0 0 40px -8px rgba(184,243,74,.35);}
  .fade-in{animation:fi .45s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pop{animation:pp .5s cubic-bezier(.2,1.3,.4,1) both;}
  @keyframes pp{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  .scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#b8f34a,transparent);animation:sc 1.5s linear infinite;}
  @keyframes sc{0%{top:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:100%;opacity:0}}
  .bar{display:inline-block;width:3px;border-radius:3px;background:#b8f34a;}
  .playing .bar{animation:wv .75s ease-in-out infinite;}
  @keyframes wv{0%,100%{height:5px}50%{height:18px}}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:6px}
  .hide-sb::-webkit-scrollbar{display:none}
</style>
</head>
<body class="glow-bg font-sans text-white min-h-screen antialiased">

<div class="relative z-10 max-w-2xl mx-auto px-5 pb-24 pt-7">

  <!-- ============ HEADER ============ -->
  <header class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-neon flex items-center justify-center">
        <span class="text-ink font-black text-lg leading-none">搭</span>
      </div>
      <div>
        <div class="font-bold tracking-tight leading-none">游戏搭子</div>
        <div class="text-[10px] text-haze mt-0.5 leading-none">今晚玩什么？我帮你找个人一起</div>
      </div>
    </div>
    <div class="flex items-center gap-1.5 text-[11px] text-haze">
      <span class="w-1.5 h-1.5 rounded-full bg-neon"></span>
      <span id="onlineCount">1,248</span> 人在线
    </div>
  </header>

  <!-- ============ SCREEN 0 · ONBOARDING ============ -->
  <section id="scrOnboard" class="fade-in">
    <div class="mb-5">
      <div class="text-[11px] text-neon font-medium mb-2 tracking-wide">第 1 步 / 共 2 步</div>
      <h1 class="text-[26px] leading-snug font-bold">先用一句话<br>介绍下你自己</h1>
      <p class="text-sm text-haze mt-2.5 leading-relaxed">不用填表，说人话就行。系统会自动整理成你的搭子名片。</p>
    </div>

    <div class="card rounded-2xl p-4 focus-glow transition-all duration-300">
      <textarea id="inpProfile" rows="3" class="w-full bg-transparent outline-none text-[15px] leading-relaxed placeholder:text-haze/60"
        placeholder="比如：我玩三角洲和瓦，水平一般，I 人，愿意开麦但不爱指挥，一般晚上 9 点后在线。"></textarea>
    </div>

    <div class="flex flex-wrap gap-2 mt-3" id="profileExamples"></div>

    <button id="btnProfile" class="w-full mt-5 h-13 py-3.5 rounded-2xl bg-neon text-ink font-bold text-[15px] active:scale-[.985] transition-transform">
      生成我的搭子名片
    </button>
    <button id="btnSkip" class="w-full mt-2.5 py-3 rounded-2xl text-haze text-sm active:scale-[.985] transition-transform">
      跳过，以游客身份直接找搭子
    </button>
  </section>

  <!-- ============ SCREEN 0.5 · PROFILE CARD ============ -->
  <section id="scrCard" class="hidden">
    <div class="mb-5">
      <div class="text-[11px] text-neon font-medium mb-2 tracking-wide">这是你的搭子名片</div>
      <h1 class="text-[26px] leading-snug font-bold">看看对不对？</h1>
      <p class="text-sm text-haze mt-2.5 leading-relaxed">点击标签可以删掉不准的。不用改也能直接开始。</p>
    </div>

    <div class="card rounded-2xl p-5 pop">
      <div class="flex items-center gap-3 mb-4">
        <div id="myAvatar" class="w-12 h-12 rounded-xl bg-gradient-to-br from-neon to-cyan2 flex items-center justify-center text-ink font-black text-xl">你</div>
        <div>
          <div class="font-bold">我</div>
          <div class="text-[11px] text-haze mt-0.5">刚刚创建</div>
        </div>
      </div>
      <div id="myTags" class="flex flex-wrap gap-2"></div>
      <p id="myRaw" class="text-[12px] text-haze/70 mt-4 pt-4 border-t border-white/10 leading-relaxed"></p>
    </div>

    <button id="btnToMatch" class="w-full mt-5 py-3.5 rounded-2xl bg-neon text-ink font-bold text-[15px] active:scale-[.985] transition-transform">
      这就是我，开始找搭子 →
    </button>
    <button id="btnBackOnboard" class="w-full mt-2.5 py-3 rounded-2xl text-haze text-sm">重新介绍一次</button>
  </section>

  <!-- ============ SCREEN 1 · MATCH INPUT ============ -->
  <section id="scrMatch" class="hidden">
    <div class="mb-5">
      <div class="flex items-center justify-between mb-2">
        <div class="text-[11px] text-neon font-medium tracking-wide">第 2 步 / 共 2 步</div>
        <button id="btnEditProfile" class="text-[11px] text-haze underline underline-offset-2">我的名片</button>
      </div>
      <h1 class="text-[26px] leading-snug font-bold">今晚想玩什么？<br>想找个什么样的人？</h1>
      <p class="text-sm text-haze mt-2.5 leading-relaxed">随便说，说得越具体匹配越准；只说个游戏名也行。</p>
    </div>

    <div class="card rounded-2xl p-4 focus-glow transition-all duration-300">
      <textarea id="inpMatch" rows="3" class="w-full bg-transparent outline-none text-[15px] leading-relaxed placeholder:text-haze/60"
        placeholder="比如：今晚 9 点想打三角洲烽火，水平一般，想找个愿意开麦、不压力的队友。"></textarea>
    </div>

    <div class="flex flex-wrap gap-2 mt-3" id="matchExamples"></div>

    <button id="btnMatch" class="w-full mt-5 py-3.5 rounded-2xl bg-neon text-ink font-bold text-[15px] active:scale-[.985] transition-transform">
      帮我找搭子
    </button>

    <div id="sessionsWrap" class="mt-8 hidden">
      <div class="text-[11px] text-haze mb-2.5 tracking-wide">最近聊过</div>
      <div id="sessionList" class="space-y-2"></div>
    </div>
  </section>

  <!-- ============ SCREEN 2 · MATCHING ANIMATION ============ -->
  <section id="scrLoading" class="hidden">
    <div class="card rounded-2xl p-6 relative overflow-hidden mt-6">
      <div class="scan"></div>
      <div class="flex flex-wrap gap-2 mb-6" id="parsedChips"></div>
      <div class="space-y-3.5" id="loadSteps"></div>
    </div>
    <button id="btnCancel" class="w-full mt-4 py-3 rounded-2xl text-haze text-sm">取消</button>
  </section>

  <!-- ============ SCREEN 3 · RESULT ============ -->
  <section id="scrResult" class="hidden">
    <div id="fallbackNote" class="hidden mb-4 rounded-xl px-4 py-3 text-[12px] leading-relaxed"
         style="background:rgba(255,190,80,.09);border:1px solid rgba(255,190,80,.28);color:#ffd79a">
      暂时没有和你需求完全一致的玩家，这是目前最接近的搭子。可以点「换一个」继续看。
    </div>

    <div class="card rounded-2xl overflow-hidden pop">
      <div class="p-5">
        <div class="flex items-start justify-between">
          <div class="flex items-center gap-3">
            <div id="rAvatar" class="w-14 h-14 rounded-2xl flex items-center justify-center font-black text-2xl text-ink"></div>
            <div>
              <div class="flex items-center gap-2">
                <span id="rName" class="font-bold text-lg"></span>
                <span id="rMbti" class="text-[10px] px-1.5 py-0.5 rounded chip text-haze"></span>
              </div>
              <div class="flex items-center gap-1.5 text-[11px] text-neon mt-1">
                <span class="w-1.5 h-1.5 rounded-full bg-neon"></span><span id="rOnline"></span>
              </div>
            </div>
          </div>
          <div class="text-right">
            <div id="rScore" class="text-3xl font-black text-neon leading-none tabular-nums">0<span class="text-lg">%</span></div>
            <div class="text-[10px] text-haze mt-1">契合度</div>
          </div>
        </div>

        <!-- voice placeholder -->
        <button id="btnVoice" class="w-full mt-4 rounded-xl chip px-4 py-3 flex items-center gap-3 active:scale-[.99] transition-transform">
          <span class="w-8 h-8 rounded-full bg-neon flex items-center justify-center shrink-0">
            <span id="voiceIcon" class="text-ink text-xs leading-none">▶</span>
          </span>
          <span id="voiceBars" class="flex items-end gap-[3px] h-[18px] flex-1"></span>
          <span id="voiceTime" class="text-[11px] text-haze tabular-nums shrink-0">0:08</span>
        </button>

        <div id="rGame" class="mt-4 text-sm text-white/85"></div>

        <div id="rReasons" class="mt-4 space-y-2"></div>

        <p id="rIntro" class="mt-4 text-[13px] text-haze leading-relaxed italic border-l-2 border-neon/40 pl-3"></p>
      </div>

      <div class="px-5 pb-3 flex items-center justify-between">
        <button id="btnReport" class="text-[11px] text-haze/60 underline underline-offset-2">举报 / 屏蔽</button>
        <div class="text-[10px] text-haze/50">模拟玩家 · Demo 演示数据</div>
      </div>
    </div>

    <button id="btnHi" class="w-full mt-4 py-3.5 rounded-2xl bg-neon text-ink font-bold text-[15px] active:scale-[.985] transition-transform">
      打个招呼
    </button>
    <div class="grid grid-cols-2 gap-3 mt-2.5">
      <button id="btnNext" class="py-3 rounded-2xl chip text-sm font-medium active:scale-[.985] transition-transform">换一个</button>
      <button id="btnShare" class="py-3 rounded-2xl chip text-sm font-medium active:scale-[.985] transition-transform">分享匹配卡</button>
    </div>
    <button id="btnRestart" class="w-full mt-2.5 py-3 rounded-2xl text-haze text-sm">重新描述需求</button>
  </section>
</div>

<!-- ============ CHAT LAYER ============ -->
<div id="chatLayer" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" id="chatBackdrop"></div>
  <div id="chatPanel" class="absolute inset-x-0 bottom-0 top-0 sm:top-10 max-w-2xl mx-auto flex flex-col bg-ink2 sm:rounded-t-3xl border-t border-white/10 transition-transform duration-300 translate-y-full">
    <div class="flex items-center gap-3 px-4 py-3.5 border-b border-white/10 shrink-0">
      <button id="btnChatBack" class="text-haze text-xl leading-none px-1">←</button>
      <div id="cAvatar" class="w-9 h-9 rounded-xl flex items-center justify-center font-black text-ink"></div>
      <div class="flex-1 min-w-0">
        <div id="cName" class="font-bold text-sm leading-tight"></div>
        <div id="cSub" class="text-[10px] text-neon mt-0.5"></div>
      </div>
      <div class="text-[10px] text-haze/50 text-right leading-tight">模拟对话<br>Demo 数据</div>
    </div>

    <div id="chatBody" class="flex-1 overflow-y-auto px-4 py-4 space-y-3"></div>

    <div class="px-4 py-3 border-t border-white/10 shrink-0" style="padding-bottom:calc(.75rem + env(safe-area-inset-bottom))">
      <div class="flex items-end gap-2">
        <div class="flex-1 card rounded-2xl px-3.5 py-2.5 focus-glow transition-all">
          <textarea id="chatInput" rows="1" class="w-full bg-transparent outline-none text-sm placeholder:text-haze/50" placeholder="说点什么…"></textarea>
        </div>
        <button id="btnSend" class="w-11 h-11 rounded-2xl bg-neon text-ink font-bold shrink-0 active:scale-95 transition-transform">↑</button>
      </div>
    </div>
  </div>
</div>

<!-- toast -->
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-8 z-[60] px-4 py-2.5 rounded-xl text-[13px] font-medium opacity-0 pointer-events-none transition-opacity duration-300"
     style="background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16)"></div>

const TIME_LABEL = {evening:'今晚在线', late:'后半夜在线', afternoon:'下午在线', anytime:'随时在线'};
const STYLE_LABEL = {chill:'佛系', comp:'竞技', explore:'探索型', social:'社交型'};
const MIC_LABEL = {yes:'愿意开麦', sometimes:'偶尔开麦', no:'不开麦'};
const LEVEL_LABEL = {1:'新手', 2:'水平普通', 3:'高手'};

/* ══════════════════════════════════════════════════
   2. 本地关键词解析（P0 · 断网可用）
   ══════════════════════════════════════════════════ */
function parse(text){
  const t = (text||'').toLowerCase();
  const r = {games:[],mode:null,time:null,level:null,style:null,mic:null,mbti:null,wants:[],raw:text};

  for(const [g,keys] of Object.entries(ALIAS))
    if(keys.some(k=>t.includes(k.toLowerCase()))) r.games.push(g);

  for(const modes of Object.values(GAMES))
    for(const m of modes) if(t.includes(m.toLowerCase())) { r.mode = m; break; }

  if(/后半夜|通宵|凌晨|半夜|很晚|夜猫/.test(t)) r.time='late';
  else if(/今晚|晚上|夜里|[89]点|九点|十点|10点|21|22/.test(t)) r.time='evening';
  else if(/下午|白天|中午|上午/.test(t)) r.time='afternoon';
  else if(/现在|马上|立刻|随时/.test(t)) r.time='anytime';

  if(/新手|萌新|刚入坑|不会玩|菜鸟|小白|刚玩|入门/.test(t)) r.level=1;
  else if(/高手|大佬|大神|上分|钻石|王者|职业|带我飞|技术好/.test(t)) r.level=3;
  else if(/一般|普通|中等|还行|凑合/.test(t)) r.level=2;

  if(/佛系|轻松|不卷|随便|娱乐|摸鱼|躺|不压力|放松/.test(t)) r.style='chill';
  else if(/上分|冲分|竞技|排位|认真|赢|carry|带我上/.test(t)) r.style='comp';
  else if(/探索|开荒|研究|新游戏|逛|剧情|地图/.test(t)) r.style='explore';
  else if(/聊天|social|社交|说话|热闹|唠/.test(t)) r.style='social';

  if(/不开麦|不想说话|静音|别开麦|打字/.test(t)) r.mic='no';
  else if(/偶尔开麦|少说话|话不多/.test(t)) r.mic='sometimes';
  else if(/开麦|语音|麦克风|说话|连麦/.test(t)) r.mic='yes';

  if(/\bi人|i人|内向|社恐|安静|话少/.test(t)) r.mbti='I';
  else if(/\be人|e人|外向|社牛|话多|能聊/.test(t)) r.mbti='E';

  const WANTS = {
    '不压力':/不压力|别压力|没压力|轻松点/, '不骂人':/不骂|别喷|不喷|脾气好|不凶/,
    '情绪稳定':/情绪稳定|心态好|不上头|稳重/, '耐心':/耐心|有耐心|愿意教|带带我|教我/,
    '会指挥':/指挥|call位|带队|会带/, '想固定':/固定|长期|以后也|常玩|每天/
  };
  for(const [w,re] of Object.entries(WANTS)) if(re.test(t)) r.wants.push(w);

  return r;
}

function chipsOf(q){
  const out = [];
  if(q.games.length) out.push(...q.games); else out.push('不限游戏');
  if(q.mode) out.push(q.mode);
  if(q.time) out.push(TIME_LABEL[q.time].replace('在线',''));
  if(q.level) out.push(LEVEL_LABEL[q.level]);
  if(q.style) out.push(STYLE_LABEL[q.style]);
  if(q.mic) out.push(MIC_LABEL[q.mic]);
  if(q.mbti) out.push(q.mbti+' 人');
  out.push(...q.wants);
  return out;
}

/* ══════════════════════════════════════════════════
   3. 匹配：游戏硬过滤 → 池内加权排序
   ══════════════════════════════════════════════════ */
const W = {time:.30, style:.25, mic:.20, level:.15, mbti:.10};

function score(q, p){
  let s = 0, hits = {};

  // 时间 30%
  let ts = q.time ? (q.time===p.time ? 1 : (p.time==='anytime'||q.time==='anytime' ? .7 : .3)) : .75;
  hits.time = ts >= .9; s += ts * W.time;

  // 目标与风格 25%
  let ss = q.style ? (q.style===p.style ? 1 : .4) : .7;
  hits.style = ss >= .9; s += ss * W.style;

  // 开麦 20%
  const micRank = {no:0, sometimes:1, yes:2};
  let ms = .7;
  if(q.mic){ const d = Math.abs(micRank[q.mic]-micRank[p.mic]); ms = d===0?1:(d===1?.6:.2); }
  hits.mic = ms >= .9; s += ms * W.mic;

  // 水平 15%
  let ls = q.level ? 1 - Math.abs(q.level-p.level)/2 : .7;
  hits.level = ls >= .9; s += ls * W.level;

  // 性格 10%
  let ps = q.mbti ? (q.mbti===p.mbti ? 1 : .5) : .7;
  hits.mbti = ps >= .9; s += ps * W.mbti;

  // wants 微加成
  const w = q.wants.filter(x=>p.traits.includes(x)).length;
  hits.wants = q.wants.filter(x=>p.traits.includes(x));
  s += Math.min(w*.04, .08);

  return {s: Math.min(s,1), hits};
}

function match(q){
  let pool = q.games.length ? POOL.filter(p=>q.games.includes(p.game)) : POOL.slice();
  let fallback = false;
  if(pool.length === 0){ pool = POOL.slice(); fallback = true; }
  const ranked = pool.map(p=>({p, ...score(q,p)})).sort((a,b)=>b.s-a.s);
  return {ranked, fallback};
}

// 契合度显示：锁 68—95，随「换一个」递减
const CAPS = [92,87,83,79,76,74,72,71,70,69,68];
function display(rawScore, idx){
  const cap = CAPS[Math.min(idx, CAPS.length-1)];
  const v = Math.round(cap - (1-rawScore)*5);
  return Math.max(68, Math.min(95, v));
}

function reasons(q, p, hits){
  const out = [];
  if(hits.style) out.push(`你们都想${STYLE_LABEL[p.style]}地玩，游戏目标一致`);
  if(hits.time)  out.push(`今晚可玩时间高度重合，都是${TIME_LABEL[p.time].replace('在线','')}的人`);
  if(hits.mic)   out.push(`沟通方式一致，都${MIC_LABEL[p.mic]}`);
  if(hits.level) out.push(`水平接近，${LEVEL_LABEL[p.level]}，不会互相拖累`);
  if(hits.mbti)  out.push(`都是 ${p.mbti} 人，相处节奏合得来`);
  if(hits.wants && hits.wants.length) out.push(`对方也是「${hits.wants.join('、')}」的类型`);
  // 兜底补充
  const spare = [
    `都在玩${p.game}，而且都常打${p.mode}`,
    `${p.traits[0]}，和你的描述比较接近`,
    `在线时段有重合，今晚能凑上`
  ];
  let i = 0;
  while(out.length < 3 && i < spare.length) out.push(spare[i++]);
  return out.slice(0,3);
}

function icebreaker(q, p){
  const g = p.game, base = [
    `在吗？看到你也玩${g}，今晚一起来两把？`,
    `嗨～${g}${p.mode}，今晚有空一起吗？`,
    `你好，看你也是${STYLE_LABEL[p.style]}路线的，一起玩会儿？`
  ];
  if(p.traits.includes('带人')) return `大哥在吗，${g}带带我呗，今晚有空不？`;
  if(p.traits.includes('新手')) return `嗨，看你也刚入坑${g}，一起慢慢摸索？`;
  if(p.mic==='no') return `你好，看你习惯打字沟通，我也不太爱开麦，${g}一起？`;
  return base[Math.abs(p.name.charCodeAt(0)) % base.length];
}

  chatWith = p;
  if(!ST.sessions[p.id]) ST.sessions[p.id] = {msgs:[], step:0};
  $('cAvatar').textContent = p.name[0];
  $('cAvatar').style.background = grad(p);
  $('cName').textContent = p.name;
  $('cSub').textContent = TIME_LABEL[p.time] + ' · ' + p.game;
  $('chatInput').value = prefill || '';
  renderChat();
  $('chatLayer').classList.remove('hidden');
  requestAnimationFrame(()=> $('chatPanel').classList.remove('translate-y-full'));
  save();
}
function closeChat(){
  $('chatPanel').classList.add('translate-y-full');
  setTimeout(()=>$('chatLayer').classList.add('hidden'), 300);
  renderSessions();
}
$('btnChatBack').onclick = closeChat;
$('chatBackdrop').onclick = closeChat;

function bubble(m){
  if(m.sys) return `<div class="text-center"><span class="text-[11px] text-haze/60 px-3 py-1 rounded-full chip">${m.text}</span></div>`;
  if(m.me) return `<div class="flex justify-end"><div class="max-w-[78%] rounded-2xl rounded-br-md px-3.5 py-2.5 text-[14px] leading-relaxed bg-neon text-ink">${m.text}</div></div>`;
  return `<div class="flex justify-start"><div class="max-w-[78%] rounded-2xl rounded-bl-md px-3.5 py-2.5 text-[14px] leading-relaxed card">${m.text}</div></div>`;
}
function renderChat(){
  const s = ST.sessions[chatWith.id];
  $('chatBody').innerHTML = s.msgs.length
    ? s.msgs.map(bubble).join('')
    : `<div class="text-center text-[12px] text-haze/50 py-8 leading-relaxed">下面这句是系统帮你想的开场白<br>可以直接发，也可以改成你自己的话</div>`;
  $('chatBody').scrollTop = $('chatBody').scrollHeight;
}
function typing(on){
  const ex = document.getElementById('typingRow');
  if(on){
    if(ex) return;
    $('chatBody').insertAdjacentHTML('beforeend',
      `<div id="typingRow" class="flex justify-start"><div class="card rounded-2xl rounded-bl-md px-4 py-3 flex gap-1">
        <i class="bar" style="width:5px;height:5px;border-radius:50%;animation:wv .9s ease-in-out infinite"></i>
        <i class="bar" style="width:5px;height:5px;border-radius:50%;animation:wv .9s ease-in-out .15s infinite"></i>
        <i class="bar" style="width:5px;height:5px;border-radius:50%;animation:wv .9s ease-in-out .3s infinite"></i>
      </div></div>`);
    $('chatBody').scrollTop = $('chatBody').scrollHeight;
  } else if(ex) ex.remove();
}

function send(){
  const v = $('chatInput').value.trim();
  if(!v || !chatWith) return;
  const s = ST.sessions[chatWith.id];
  s.msgs.push({me:true, text:v});
  $('chatInput').value = ''; renderChat(); save();

  const p = chatWith;
  const replies = [ p.c1, p.c2, `行，那就这么定了。房间号 ${p.room}，你直接进就行 🎮` ];
  const reply = replies[Math.min(s.step, replies.length-1)];
  s.step++;

  setTimeout(()=>typing(true), 350);
  setTimeout(()=>{
    typing(false);
    s.msgs.push({me:false, text:reply});
    if(s.step === 3){
      s.msgs.push({sys:true, text:'已建立联系 · Demo 到此结束'});
    }
    renderChat(); save();
  }, 1250);
}
$('btnSend').onclick = send;
$('chatInput').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

/* 会话列表 */
function renderSessions(){
  const ids = Object.keys(ST.sessions).filter(k=>ST.sessions[k].msgs.length);
  $('sessionsWrap').classList.toggle('hidden', ids.length===0);
  $('sessionList').innerHTML = ids.map(id=>{
    const p = POOL.find(x=>x.id===id), s = ST.sessions[id];
    const last = s.msgs[s.msgs.length-1];
    return `<button data-id="${id}" class="w-full card rounded-2xl px-3.5 py-3 flex items-center gap-3 text-left active:scale-[.99] transition-transform">
      <span class="w-9 h-9 rounded-xl flex items-center justify-center font-black text-ink shrink-0" style="background:${grad(p)}">${p.name[0]}</span>
      <span class="flex-1 min-w-0">
        <span class="block font-semibold text-sm">${p.name}</span>
        <span class="block text-[11px] text-haze truncate">${last.text}</span>
      </span>
      <span class="text-[10px] text-haze/50 shrink-0">${p.game}</span>
    </button>`;
  }).join('');
  [...$('sessionList').children].forEach(b=>{
    b.onclick = ()=> openChat(POOL.find(x=>x.id===b.dataset.id), '');
  });
}

/* ══════════════════════════════════════════════════
   9. 启动
   ══════════════════════════════════════════════════ */
(function boot(){
  document.querySelectorAll('textarea').forEach(t=>{
    t.addEventListener('input', ()=>{ t.style.height='auto'; t.style.height = Math.min(t.scrollHeight, 140)+'px'; });
  });
  if(ST.profile){ $('inpProfile').value = ST.profile.raw || ''; show('scrMatch'); renderSessions(); }
  else show('scrOnboard');
})();
</script>
</body>
